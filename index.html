  <!-- sets the theme before the first paint (saved choice, else the system's), so there is no light flash -->
  <script>
    (function () {
      var saved = (document.cookie.match(/(?:^|; )theme=(light|dark)/) || [])[1];
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
    })();
